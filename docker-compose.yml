# docker-compose.yml
version: '3.8'

services:
  nextjs:
    build: .
    container_name: coisas-partilhadas-app
    restart: unless-stopped
    expose:
      - "3006"  # Interno no container
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
    volumes:
      - uploads:/app/public/uploads
      - ./public/uploads:/app/public/uploads:rw
    command: sh -c "npx prisma migrate deploy && node server.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    expose:
      - "5432"  # Só exposto internamente
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - web
    command: postgres -c 'max_connections=100' -c 'shared_buffers=256MB'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data    # Para SSL certificates
      - caddy_config:/config # Para configuração
      - uploads:/app/public/uploads:ro
    depends_on:
      nextjs:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  web:
    driver: bridge