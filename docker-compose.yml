services:
  app:
    build: .
    container_name: nextjs_app
    ports:
      - "3006:3006"
    
    # Manter o env_file para a fase de build ou outras variáveis
    env_file:
      - .env
    
    # 🎯 Injeção Explícita da Variável de Conexão
    environment:
      - NODE_ENV=production
      # Valor copiado diretamente do seu .env. O hostname 'db' é crucial.
      - DATABASE_URL=postgresql://coisas_user:password123@db:5432/coisas_partilhadas

    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  web:
    external: true