version: "3.9"

services:
  app:
    image: coisas-partilhadas-app
    container_name: nextjs_app
    ports:
      - "3006:3006"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web

volumes:
  pgdata:

networks:
  web:
    external: true
