version: "3.9"

services:
  app:
    image: node:20-alpine
    container_name: nextjs_app
    working_dir: /app
    volumes:
      - ./app:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    ports:
      - "3006:3006"
    networks:
      - web
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web

volumes:
  pgdata:

networks:
  web:
    external: true
