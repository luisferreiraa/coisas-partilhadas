services:
  app:
    build: .
    container_name: nextjs_app
    ports:
      - "3006:3006"         # porta exposta no VPS
    env_file:
      - .env
    networks:
      - web
    depends_on:
      - db
    restart: unless-stopped  # garante que reinicia se houver crash

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web

volumes:
  pgdata:

networks:
  web:
    external: true
